<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammed Alhamoud, AI Engineer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#fff4dc;--fg:#1e1b4b;--muted:#5a5480;--card:#fff;--line:#1e1b4b;--accent:#b4400f;--tag:#ffe3a8;--gold:#ffd166;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1e1b4b;--fg:#fff1c9;--muted:#b9b1e6;--card:#2a2563;--line:#fff1c9;--accent:#ffb454;--tag:#3d3585;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1b4b;--fg:#fff1c9;--muted:#b9b1e6;--card:#2a2563;--line:#fff1c9;--accent:#ffb454;--tag:#3d3585;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3,.px{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;font-weight:400;line-height:1.5}
h1{font-size:clamp(15px,4vw,24px);margin:8px 0}
h2{font-size:clamp(12px,2.8vw,15px);margin:0 0 12px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sub{margin:0 0 14px;color:var(--muted);max-width:60ch}
button,a.btn{font-family:"Press Start 2P",ui-monospace,monospace;cursor:pointer}
.tod{font-size:9px;color:var(--bg);background:var(--fg);border:3px solid var(--line);padding:9px 10px;box-shadow:3px 3px 0 var(--accent)}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);touch-action:manipulation;background:#1e1b4b}
.st{position:absolute;bottom:35.5%;transform:translateX(-50%);font-size:clamp(6px,1.7vw,10px);padding:5px 6px;color:var(--fg);background:var(--card);border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);white-space:nowrap}
.st[aria-current="true"]{background:var(--gold);color:#1e1b4b}
.pad{display:flex;gap:12px;align-items:center;margin:18px 0 6px}
.pad button{font-size:16px;width:56px;height:48px;color:var(--bg);background:var(--fg);border:3px solid var(--line);box-shadow:3px 3px 0 var(--accent);touch-action:none;user-select:none}
.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent)}
#say{margin:0;color:var(--muted);font-size:14px;min-height:1.6em}
.box{background:var(--card);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);padding:18px 20px;margin-top:18px;min-height:150px}
.box p{margin:0 0 10px;max-width:62ch}
.stat{font-size:clamp(18px,4.5vw,26px);color:var(--accent);margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:10px 0 0}
.tags li{background:var(--tag);border:2px solid var(--line);padding:2px 10px;font-size:13px}
a{color:var(--accent);font-weight:600}
a.btn{display:inline-block;font-size:10px;text-decoration:none;color:var(--bg);background:var(--fg);padding:11px 12px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--accent);margin:4px 8px 4px 0;font-weight:400}
.ach{margin-top:18px;padding:14px 16px;background:var(--gold);color:#1e1b4b;border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);font-size:11px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{margin-top:32px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><h1>Mohammed Alhamoud</h1><p class="sub">AI Engineer from Abha. Walk around my world to see what I’ve built.</p></div>
    <button class="tod" id="tod">Night</button>
  </div>
  <div class="stage" id="stage"><canvas id="c" width="160" height="90" role="img" aria-label="Pixel world: a character in a white thobe and ghutra walks between five signposts, with a pet orange cat following."></canvas></div>
  <div class="pad"><button id="L" aria-label="Walk left">◀</button><button id="R" aria-label="Walk right">▶</button><span class="px" style="font-size:9px;color:var(--muted)">Or tap the ground</span></div>
  <p id="say">Tip: tap the cat.</p>
  <section class="box" id="panel" aria-live="polite"></section>
  <p class="ach" id="ach" hidden>Achievement unlocked: you visited every sign. Legendary explorer!</p>
  <footer>Arabic (native), English (fluent). Based in Abha, open to relocation within Saudi Arabia.</footer>
</main>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S=[{id:'about',x:14,t:'About'},{id:'saer',x:45,t:'Saer'},{id:'insight',x:80,t:'Insight'},{id:'ids',x:115,t:'IDS'},{id:'hi',x:146,t:'Contact'}];
const P={
start:`<h2>Start walking</h2><p>Use ◀ ▶, the arrow keys, or tap the ground. Each sign tells part of my story.</p>`,
about:`<h2>About me</h2><p>Computer Engineering graduate (King Khalid University, 2026) and AI Engineering Bootcamp graduate. I train machine learning and computer vision models and turn them into apps people can use. I’m looking for a junior AI Engineer role in Saudi Arabia.</p><ul class="tags"><li>Python</li><li>PyTorch</li><li>scikit-learn</li><li>FastAPI</li><li>React</li><li>Linux</li><li>Raspberry Pi</li></ul><p style="margin-top:12px">Five Huawei HCIA certificates, a Robotics Camp at KKU, and a love for building things that run on real hardware.</p>`,
saer:`<h2>Saer, an AI used-car marketplace</h2><p class="stat px">R² 0.875</p><p>Bootcamp capstone, built with a team of 3. It estimates car prices from specs, identifies the make and model from a photo (94.58% across 59 classes), recommends cars within a budget, and compares vehicles. Trained on 2,742 listings I collected and cleaned.</p><a class="btn" href="https://github.com/mega-eng/saer">Open on GitHub</a>`,
insight:`<h2>CarInsight AI</h2><p class="stat px">R² 0.848</p><p>Guesses a car’s price in SAR from 1 to 8 photos alone, with no make, model, year, or mileage. DINOv2 and CLIP features feed a 3-model ensemble. Median error is 10.7% against 41.6% for a constant guess, with a Gradio demo you can try.</p><a class="btn" href="https://github.com/mega-eng/car-PRICE-BY-AI">Open on GitHub</a>`,
ids:`<h2>AI-enhanced intrusion detection</h2><p class="stat px">~99%</p><p>Graduation project, built with a team of 5. Snort alerts are classified by a Random Forest into six traffic classes and scored 0 to 100 across five risk levels. Trained on 2.8M+ CICIDS2017 records (0.97 macro F1), with a Flask dashboard on a Raspberry Pi 5.</p><a class="btn" href="https://github.com/mega-eng/AI-Enhanced-Intrusion-Detection-System-with-Risk-Assessment">Open on GitHub</a>`,
hi:`<h2>Say hello</h2><p>I’m open to junior AI Engineer roles anywhere in Saudi Arabia. The fastest way to reach me is email.</p><a class="btn" href="mailto:alhamoud.eng@gmail.com">Email me</a><a class="btn" href="https://linkedin.com/in/mohammed-al-hamoud-5m">LinkedIn</a><a class="btn" href="https://github.com/mega-eng">GitHub</a>`
};
const sty=document.createElement('style');
S.forEach(s=>{const b=document.createElement('button');b.className='st';b.dataset.id=s.id;b.textContent=s.t;b.style.left=s.x/160*100+'%';b.onclick=()=>{target=s.x};$('#stage').appendChild(b)});
const day={sky:['#1e1b4b','#322a6b','#5a2d82','#8a3a85','#b4476f','#e0646b','#f59e5b','#ffc46b'],m:['#5c3c7a','#3c285f','#221842'],gr:'#2a1d4d',gl:'#4b3a7a',leaf:'#3f9a5f',cl:'#ffcdaa'};
const night={sky:['#070a1f','#0b1030','#101847','#16205a','#1c2a6b','#223478','#283f86','#2e4a94'],m:['#25306a','#182050','#0e1338'],gr:'#0a0e2a',gl:'#1a2260',leaf:'#1f6b4a',cl:'#3a4a8a'};
const H={w:'#fff',g:'#d3cfe6',k:'#1a1a1a',s:'#d9a066'},O={b:'#f08a2e',d:'#c8621a',w:'#ffe0b8',k:'#1a1a1a'};
const hero=["..wwwww..",".wwwwwww.",".kkkkkkk.",".wsssssw.",".wsksksw.",".wsssssw.","..wsssw..",".wwwwwww.","wwwwwwwww","wwwwwwwwg","wwwwwwwgg",".wwwwwww.",".wwwwwwg."];
const feet=[".kk...kk.","..kk.kk.."];
const otter=["b.b......b","bbb......b","bkbdbdbdbb","wwbbbbbbbb",".bbbbbbbbb",".bb..bb..."];
let hx=80,ox=62,dir=1,walk=0,target=null,night_=false,cur=null,t=0,keys={},hearts=[];const seen=new Set();
function spr(rows,pal,x,y,flip){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=r[flip?r.length-1-i:i];if(c!=='.'){g.fillStyle=pal[c];g.fillRect(Math.round(x)+i,y+j,1,1)}}})}
function disc(cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)g.fillRect(cx+x,cy+y,1,1)}
function tri(cx,top,c){g.fillStyle=c;for(let y=top;y<74;y++){const w=y-top;g.fillRect(cx-w,y,2*w+1,1)}}
function palm(x,y,c){g.fillStyle='#6b4a2e';g.fillRect(x,y+4,2,16);g.fillStyle=c;g.fillRect(x-5,y+3,6,1);g.fillRect(x+2,y+3,6,1);g.fillRect(x-3,y+1,4,1);g.fillRect(x+2,y+1,4,1);g.fillRect(x-1,y,3,1);g.fillRect(x-6,y+4,2,1);g.fillRect(x+7,y+4,2,1)}
function flw(n,y0,rg,seed){const cols=night_?['#9a63c9','#7f4cb0','#c08ae6']:['#b57bd6','#9b5fc8','#d7aef0'];for(let i=0;i<n;i++){const x=(i*37+seed*11)%152+3,y=y0+((i*13+seed)%rg),sw=rm?0:Math.round(Math.sin(t*0.03+i)*0.6);g.fillStyle=night_?'#1f6b4a':'#3f9a5f';g.fillRect(x+1,y+2,1,2);g.fillStyle=cols[i%3];g.fillRect(x+sw,y,3,1);g.fillRect(x+1+sw,y-1,1,3);g.fillStyle='#ffe27a';g.fillRect(x+1+sw,y,1,1)}}
function draw(){
  const C=night_?night:day;
  C.sky.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*12,160,12)});
  if(night_){for(let i=0;i<30;i++){const x=(i*53)%160,y=(i*29)%48;if(rm||(i+(t>>5))%4)g.fillStyle='#fff1c9',g.fillRect(x,y,1,1)}disc(122,22,6,'#fff1c9');disc(125,20,5,C.sky[1])}
  else disc(122,56,7,'#ffec9f');
  const cx=rm?40:((t*0.04)%200)-20;g.fillStyle=C.cl;[[cx,14],[cx+90,24]].forEach(([x,y])=>{g.fillRect(x,y,12,2);g.fillRect(x+3,y-2,7,2)});
  tri(20,40,C.m[0]);tri(150,34,C.m[0]);tri(50,52,C.m[1]);tri(125,56,C.m[1]);tri(85,64,C.m[2]);tri(8,58,C.m[2]);tri(158,60,C.m[2]);
  g.fillStyle=C.gr;g.fillRect(0,74,160,16);g.fillStyle=C.gl;g.fillRect(0,74,160,1);
  for(let i=0;i<20;i++)g.fillRect((i*37)%160,78+(i*7)%10,2,1);
  palm(62,56,C.leaf);palm(131,54,C.leaf);
  S.forEach(s=>{g.fillStyle='#6b4a2e';g.fillRect(s.x-1,58,2,16)});
  hearts.forEach(h=>{g.fillStyle='#ff5a6e';g.fillRect(h.x,h.y,1,1);g.fillRect(h.x+2,h.y,1,1);g.fillRect(h.x,h.y+1,3,1);g.fillRect(h.x+1,h.y+2,1,1)});
  const w=Math.floor(walk)%2,bob=(target!==null||keys.l||keys.r)&&w?1:0;
  spr(otter,O,ox-5,71,dir>0);
  spr(hero,H,hx-4.5,62-bob,dir<0);spr([feet[w]],H,hx-4.5,75-bob,dir<0);
}
function setSt(id){cur=id;document.querySelectorAll('.st').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));$('#panel').innerHTML=P[id||'start'];
  if(id){seen.add(id);if(seen.size===S.length&&$('#ach').hidden){$('#ach').hidden=false;burst()}}}
function burst(){for(let i=0;i<6;i++)hearts.push({x:ox-4+i*2,y:68-(i%3)*3,l:90})}
function loop(){t++;let mv=keys.l?-1:keys.r?1:0;
  if(mv)target=null;else if(target!==null){if(Math.abs(target-hx)<0.8)target=null;else mv=Math.sign(target-hx)}
  if(mv){hx=Math.max(6,Math.min(154,hx+mv*0.55));dir=mv;walk+=0.15}
  ox+=(Math.max(6,Math.min(154,hx-dir*13))-ox)*0.05;
  hearts.forEach(h=>{h.y-=0.25;h.l--});hearts=hearts.filter(h=>h.l>0);
  const a=S.find(s=>Math.abs(s.x-hx)<9);const id=a?a.id:null;if(id!==cur)setSt(id);
  draw();lil();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){keys.l=1;e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'){keys.r=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0});
[['L','l'],['R','r']].forEach(([id,k])=>{const b=$('#'+id);b.onpointerdown=()=>{keys[k]=1};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0}))});
cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*160,y=(e.clientY-r.top)/r.height*90;
  if(Math.abs(x-ox)<8&&y>68){hearts.push({x:ox-1,y:68,l:80},{x:ox+3,y:66,l:70});$('#say').textContent=['Meow!','The cat approves.','Keep exploring!'][Math.floor(Math.random()*3)]}else target=Math.max(6,Math.min(154,x))};
$('#tod').onclick=()=>{night_=!night_;$('#tod').textContent=night_?'Day':'Night'};
const fl=document.createElement('canvas');fl.style.cssText='position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none;background:none;border:0;box-shadow:none;aspect-ratio:auto';fl.setAttribute('aria-hidden','true');$('#stage').appendChild(fl);const fx=fl.getContext('2d'),hd={};
function head(nt,seed){const c=document.createElement('canvas');c.width=200;c.height=150;const x=c.getContext('2d');x.translate(100,80);x.scale(1,.72);
 const pal=nt?['#4a2468','#8a5cb8','#cdb0ea']:['#6f3a96','#b98be0','#f3e3fc'];
 for(let k=0;k<6;k++){x.save();x.rotate(k*Math.PI/3+seed*.3);const L=k%2?70:78,w=k%2?.36:.44;
  const gr=x.createLinearGradient(0,0,0,-L);gr.addColorStop(0,pal[0]);gr.addColorStop(.45,pal[1]);gr.addColorStop(1,pal[2]);x.fillStyle=gr;
  x.beginPath();x.moveTo(0,0);x.bezierCurveTo(L*w*1.3,-L*.25,L*w*1.1,-L*.8,0,-L);x.bezierCurveTo(-L*w*1.1,-L*.8,-L*w*1.3,-L*.25,0,0);x.fill();
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,-6);x.lineTo(0,-L*.8);x.stroke();
  x.fillStyle='rgba(60,20,90,.55)';for(let i=0;i<5;i++){x.beginPath();x.arc(((i*7+k*3)%11-5)*1.4,-14-i*7,1.6,0,7);x.fill()}
  x.restore()}
 for(let k=0;k<6;k++){const a=k*Math.PI/3+.3+seed*.3,sx=Math.sin(a)*34,sy=-Math.cos(a)*34;x.strokeStyle=nt?'#c9b27a':'#e9d9a0';x.lineWidth=1.6;x.beginPath();x.moveTo(0,0);x.lineTo(sx,sy);x.stroke();x.fillStyle='#7a4a1e';x.beginPath();x.ellipse(sx,sy,3.2,5,a,0,7);x.fill()}
 x.fillStyle='#e8f3a8';x.beginPath();x.arc(0,0,4,0,7);x.fill();return c}
function petal(nt){const c=document.createElement('canvas');c.width=60;c.height=100;const x=c.getContext('2d');x.translate(30,90);const gr=x.createLinearGradient(0,0,0,-85);gr.addColorStop(0,nt?'#5a2f7a':'#7b45a3');gr.addColorStop(.5,nt?'#9467c0':'#c29ae6');gr.addColorStop(1,nt?'#cdb0ea':'#f3e3fc');x.fillStyle=gr;x.beginPath();x.moveTo(0,0);x.bezierCurveTo(34,-25,30,-70,0,-85);x.bezierCurveTo(-30,-70,-34,-25,0,0);x.fill();x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,-6);x.lineTo(0,-65);x.stroke();return c}
const LL=Array.from({length:56},(_,i)=>({fx:(i*.618034+.07)%1,d:(i*.37+.11)%1,v:i%3,ph:i*1.7,fl:i%5<2}));
function lil(){const W=fl.clientWidth,Hh=fl.clientHeight,r=devicePixelRatio||1;if(fl.width!==Math.round(W*r)){fl.width=Math.round(W*r);fl.height=Math.round(Hh*r)}
 fx.setTransform(r,0,0,r,0,0);fx.clearRect(0,0,W,Hh);const n=+night_,hs=(hd[n]=hd[n]||[0,1,2].map(s=>head(night_,s))),pt=(hd['p'+n]=hd['p'+n]||petal(night_)),tt=rm?0:t;
 LL.forEach(l=>{const sp=.0006+.0009*l.d,y=(((l.ph*.31+tt*sp)%1.3)-.15)*Hh,x=l.fx*W+Math.sin(tt*.017+l.ph)*W*.025,ro=tt*.012*(l.v-1||.7)+l.ph,s=.025+.03*l.d;
  fx.save();fx.translate(x,y);
  if(l.fl){const R=Hh*s*1.1,k=R/80;fx.rotate(ro);fx.scale(1,.5+.5*Math.abs(Math.cos(tt*.015+l.ph)));fx.drawImage(hs[l.v],-100*k,-80*k,200*k,150*k)}
  else{const P=Hh*s*.9,k=P/85;fx.rotate(Math.sin(tt*.02+l.ph)*1.2);fx.drawImage(pt,-30*k,-90*k,60*k,100*k)}
  fx.restore()})}
setSt(null);requestAnimationFrame(loop);
</script>
</body>
</html>
